substitutions:
  _REGION: asia-east1
  _REPOSITORY: battle-bus
  _IMAGE_TAG: manual

steps:
  - id: build-migrations
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.migrations
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/battle-bus-migrations:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/battle-bus-migrations:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

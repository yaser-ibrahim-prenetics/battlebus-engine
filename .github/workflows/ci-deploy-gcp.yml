name: CI and deploy to GCP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-bus-${{ github.ref }}
  # A cancelled migration can continue in Cloud Run after the GitHub runner
  # exits. Serialize main releases so a second deployment cannot overtake it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  GCP_PROJECT_ID: battle-bus-509406
  GCP_REGION: asia-east1
  ARTIFACT_REPOSITORY: battle-bus
  CLOUD_RUN_SERVICE: battle-bus
  MIGRATION_JOB: battle-bus-migrate
  CLOUD_SQL_INSTANCE: battle-bus-509406:asia-east1:battle-platform-staging-pg16
  DATABASE_URL_SECRET: battle-platform-database-url
  RUNTIME_SERVICE_ACCOUNT: battle-bus-runtime@battle-bus-509406.iam.gserviceaccount.com
  MIGRATION_SERVICE_ACCOUNT: battle-bus-migrator@battle-bus-509406.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: battle-bus-deployer@battle-bus-509406.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/1057846333023/locations/global/workloadIdentityPools/github-actions/providers/battle-platform-main
  HUSKY: "0"

jobs:
  verify:
    name: Lint, test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: battle_platform_migrations
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battle_platform_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go for golang-migrate
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Scan proposed changes for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Secret Manager inventory
        run: npm run security:validate-secrets

      - name: Validate and test database migrations
        id: migrations
        continue-on-error: true
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          npm run db:validate
          npm run db:validate:test
          npm run db:test

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint:ci

      - name: Test
        id: test
        continue-on-error: true
        run: npm test -- --reporter=dot

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce quality gates
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          MIGRATIONS_RESULT: ${{ steps.migrations.outcome }}
        run: |
          failed=0
          for gate in LINT TEST AUDIT BUILD MIGRATIONS; do
            result_variable="${gate}_RESULT"
            result="${!result_variable}"
            echo "${gate}: ${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"

  deploy:
    name: Build image and deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GCP_DEPLOY == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gcp-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Verify required runtime configuration
        env:
          DATABASE_MIGRATIONS_ENABLED: ${{ vars.ENABLE_DATABASE_MIGRATIONS }}
          DATABASE_URL_SECRET_VERSION: ${{ vars.DATABASE_URL_SECRET_VERSION }}
        run: |
          service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format=json)"

          env_names="$(jq -r '.spec.template.spec.containers[0].env[]?.name' <<<"${service_json}")"
          for required_name in INNGEST_SIGNING_KEY INNGEST_EVENT_KEY BATTLE_BUS_API_KEY SHOPIFY_TEST_WEBHOOK_SECRET; do
            if ! jq --exit-status --arg name "${required_name}" '
              any(.spec.template.spec.containers[0].env[]?;
                .name == $name and .valueFrom.secretKeyRef? != null)
            ' <<<"${service_json}" >/dev/null; then
              echo "Cloud Run is missing required Secret Manager configuration: ${required_name}"
              exit 1
            fi
          done

          while IFS= read -r secret_name; do
            [[ -z "${secret_name}" || "${secret_name}" == \#* ]] && continue
            if jq --exit-status --arg name "${secret_name}" '
              any(.spec.template.spec.containers[0].env[]?;
                .name == $name and (. | has("value")))
            ' <<<"${service_json}" >/dev/null; then
              echo "Cloud Run secret must not be stored as plaintext: ${secret_name}"
              exit 1
            fi
          done < config/gcp-secret-env-names.txt

          if [ "${DATABASE_MIGRATIONS_ENABLED}" = "true" ]; then
            if [[ ! "${DATABASE_URL_SECRET_VERSION}" =~ ^[0-9]+$ ]]; then
              echo "DATABASE_URL_SECRET_VERSION must be a pinned numeric Secret Manager version."
              exit 1
            fi
            secret_state="$(gcloud secrets versions describe "${DATABASE_URL_SECRET_VERSION}" \
              --secret="${DATABASE_URL_SECRET}" \
              --project="${GCP_PROJECT_ID}" \
              --format='value(state)')"
            if [ "${secret_state}" != "ENABLED" ]; then
              echo "${DATABASE_URL_SECRET} version ${DATABASE_URL_SECRET_VERSION} is not enabled."
              exit 1
            fi
            if ! gcloud iam service-accounts describe "${MIGRATION_SERVICE_ACCOUNT}" \
              --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              echo "Missing migration service account: ${MIGRATION_SERVICE_ACCOUNT}"
              exit 1
            fi
            if ! gcloud sql instances describe "${CLOUD_SQL_INSTANCE##*:}" \
              --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              echo "Missing Cloud SQL instance: ${CLOUD_SQL_INSTANCE}"
              exit 1
            fi
          fi

          previous_revision="$(jq -r '.status.latestReadyRevisionName // empty' <<<"${service_json}")"
          service_url="$(jq -r '.status.url // empty' <<<"${service_json}")"
          if [ -z "${previous_revision}" ] || [ -z "${service_url}" ]; then
            echo "Cloud Run did not report a ready revision and service URL."
            exit 1
          fi
          echo "PREVIOUS_REVISION=${previous_revision}" >> "${GITHUB_ENV}"
          echo "CLOUD_RUN_URL=${service_url}" >> "${GITHUB_ENV}"

      - name: Build container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: docker build --tag "${IMAGE_URI}" .

      - name: Smoke test container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8080:8080 "${IMAGE_URI}")"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          curl --fail --show-error --silent \
            --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/api/health | jq --exit-status '.ok == true and .service == "battle-bus"'

      - name: Push container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: docker push "${IMAGE_URI}"

      - name: Build isolated migration image
        env:
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: docker build --file Dockerfile.migrations --tag "${MIGRATION_IMAGE_URI}" .

      - name: Verify isolated migration image contents
        env:
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: |
          docker run --rm --entrypoint /bin/sh "${MIGRATION_IMAGE_URI}" -c '
            test -x /usr/local/bin/cloud-run-migrate
            test "$(find /migrations -type f -name "*.up.sql" | wc -l)" -gt 0
            test "$(find /migrations -type f -name "*.down.sql" | wc -l)" -gt 0
          '

      - name: Push isolated migration image
        env:
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: docker push "${MIGRATION_IMAGE_URI}"

      - name: Update isolated migration job
        if: vars.ENABLE_DATABASE_MIGRATIONS == 'true'
        env:
          DATABASE_URL_SECRET_VERSION: ${{ vars.DATABASE_URL_SECRET_VERSION }}
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: |
          if ! gcloud run jobs describe "${MIGRATION_JOB}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            {
              echo "### Migration job bootstrap required"
              echo
              echo "The immutable migration image was pushed, but ${MIGRATION_JOB} does not exist."
              echo "Run scripts/bootstrap-migration-job.sh as a GCP administrator, then rerun this workflow."
              echo
              echo "Image: \`${MIGRATION_IMAGE_URI}\`"
              echo "Release: \`${GITHUB_SHA}\`"
              echo "Secret version: \`${DATABASE_URL_SECRET_VERSION}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          gcloud run jobs deploy "${MIGRATION_JOB}" \
            --image="${MIGRATION_IMAGE_URI}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --service-account="${MIGRATION_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
            --set-secrets="DATABASE_URL=${DATABASE_URL_SECRET}:${DATABASE_URL_SECRET_VERSION}" \
            --set-env-vars="MIGRATION_RELEASE_SHA=${GITHUB_SHA},DATABASE_URL_SECRET_VERSION=${DATABASE_URL_SECRET_VERSION}" \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=900s \
            --cpu=1 \
            --memory=512Mi \
            --quiet

      - name: Apply additive migrations in Cloud Run Job
        if: vars.ENABLE_DATABASE_MIGRATIONS == 'true'
        run: |
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --wait
          echo "Migration job ${MIGRATION_JOB} completed for ${GITHUB_SHA}." | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Deploy signed-webhook dry-run candidate without traffic
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          candidate_tag="candidate-${GITHUB_SHA::8}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image="${IMAGE_URI}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --concurrency=20 \
            --min-instances=0 \
            --max-instances=10 \
            --ingress=all \
            --allow-unauthenticated \
            --no-traffic \
            --tag="${candidate_tag}" \
            "--update-env-vars=DRY_RUN_MODE=true,SHOPIFY_STORE_MODE=test,ENABLE_DYNAMICS_SYNC=false,ENABLE_GPS_SYNC=false,ENABLE_STORD_SYNC=false,ENABLE_INVENTORY_RUNS=false,ENABLE_INVENTORY_SYNC=false,ENABLE_PRODUCT_INVENTORY_SYNC_CRON=false,ENABLE_RETURN_INVOICE_POSTING=false,ENABLE_SHOPIFY_FULFILLMENT_WRITEBACK=false,ENABLE_GPS_FULFILLMENT_SIMULATION=false,ENABLE_LOOP_RETURNS=false,DISABLE_LOOP_WEBHOOK_VERIFICATION=false,ENABLE_SLACK_RISK_CHECK=false,CS_PLATFORM_ENABLED=false,INNGEST_DEV=0,INNGEST_SERVE_ORIGIN=${CLOUD_RUN_URL},INNGEST_SERVE_PATH=/api/inngest,BATTLE_BUS_VERSION=${GITHUB_SHA}" \
            --quiet

      - name: Verify candidate revision and promote
        run: |
          candidate_revision="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(status.latestCreatedRevisionName)')"
          if [ -z "${candidate_revision}" ]; then
            echo "Cloud Run did not report a candidate revision."
            exit 1
          fi
          ready_status="$(gcloud run revisions describe "${candidate_revision}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format=json | jq -r '.status.conditions[] | select(.type == "Ready") | .status')"
          if [ "${ready_status}" != "True" ]; then
            echo "Cloud Run candidate revision is not ready."
            exit 1
          fi
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --to-revisions="${candidate_revision}=100" \
            --quiet
          echo "Promoted ${candidate_revision}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Verify public signed endpoints and sync Inngest
        run: |
          rollback() {
            echo "Post-deployment verification failed; rolling traffic back to ${PREVIOUS_REVISION}."
            gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
              --region="${GCP_REGION}" \
              --project="${GCP_PROJECT_ID}" \
              --to-revisions="${PREVIOUS_REVISION}=100" \
              --quiet
          }
          trap rollback ERR

          public_member="$(gcloud run services get-iam-policy "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --flatten='bindings[].members' \
            --filter='bindings.members:allUsers' \
            --format='value(bindings.members)')"
          if [ -z "${public_member}" ]; then
            echo "Cloud Run must allow public transport so Inngest and webhook providers can reach signed application endpoints."
            false
          fi

          curl --fail --show-error --silent \
            --retry 10 --retry-delay 2 --retry-all-errors \
            "${CLOUD_RUN_URL}/api/health" \
            | jq --exit-status '.ok == true and .service == "battle-bus"'

          curl --fail --show-error --silent \
            --retry 10 --retry-delay 2 --retry-all-errors \
            "${CLOUD_RUN_URL}/api/inngest" \
            | jq --exit-status '.function_count > 0 and .has_signing_key == true and .has_event_key == true'

          sync_response="$(curl --fail --show-error --silent \
            --request PUT \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "${CLOUD_RUN_URL}/api/inngest")"
          jq --exit-status 'has("modified") and (.message | type == "string")' <<<"${sync_response}"

          trap - ERR
          echo "Inngest synced to ${CLOUD_RUN_URL}/api/inngest" | tee -a "${GITHUB_STEP_SUMMARY}"

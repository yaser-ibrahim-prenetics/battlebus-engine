name: CI and deploy to GCP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-bus-${{ github.ref }}
  # A cancelled migration can continue in Cloud Run after the GitHub runner
  # exits. Serialize main releases so a second deployment cannot overtake it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  GCP_PROJECT_ID: battle-bus-509406
  GCP_REGION: asia-east1
  ARTIFACT_REPOSITORY: battle-bus
  CLOUD_RUN_SERVICE: battle-bus
  MIGRATION_JOB: battle-bus-migrate
  CLOUD_SQL_INSTANCE: battle-bus-509406:asia-east1:battle-platform-staging-pg16
  DB_NAME: battle_platform
  DB_USER: battle-bus-runtime@battle-bus-509406.iam
  DATABASE_URL_SECRET: battle-platform-database-url
  RUNTIME_SERVICE_ACCOUNT: battle-bus-runtime@battle-bus-509406.iam.gserviceaccount.com
  MIGRATION_SERVICE_ACCOUNT: battle-bus-migrator@battle-bus-509406.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: battle-bus-deployer@battle-bus-509406.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/1057846333023/locations/global/workloadIdentityPools/github-actions/providers/battle-platform-main
  CHANNEL_LIFT_ENABLED: ${{ vars.CHANNEL_LIFT_ENABLED || 'false' }}
  CHANNEL_LIFT_SEND_ENABLED: ${{ vars.CHANNEL_LIFT_SEND_ENABLED || 'false' }}
  CHANNEL_LIFT_TRIPLE_WHALE_SHOP_ID: ${{ vars.CHANNEL_LIFT_TRIPLE_WHALE_SHOP_ID }}
  CHANNEL_LIFT_META_DATASET_ID: ${{ vars.CHANNEL_LIFT_META_DATASET_ID }}
  CHANNEL_LIFT_SOURCE_URL: ${{ vars.CHANNEL_LIFT_SOURCE_URL }}
  HUSKY: "0"

jobs:
  release-policy:
    name: Verify selective release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test selective release engine
        run: python3 scripts/release/test_selective.py
      - name: Require an exact selected release
        if: vars.ENABLE_SELECTIVE_RELEASE == 'true'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Use policy from main rather than trusting a PR to weaken its own gate.
          git show origin/main:scripts/release/selective.py > "$RUNNER_TEMP/selective-policy.py"
          args=()
          if [ -z "$EXPECTED_BASE" ] && [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            EXPECTED_BASE="$(git rev-parse origin/main)"
          fi
          if [ -n "$EXPECTED_BASE" ]; then args+=(--expected-base "$EXPECTED_BASE"); fi
          python3 "$RUNNER_TEMP/selective-policy.py" verify "${args[@]}"
  verify:
    name: Lint, test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: battle_platform_migrations
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battle_platform_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go for golang-migrate
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Scan proposed changes for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Secret Manager inventory
        run: npm run security:validate-secrets

      - name: Validate and test database migrations
        id: migrations
        continue-on-error: true
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          npm run db:validate
          npm run db:validate:test
          node --test scripts/ledger-provider-expansion.test.mjs
          npm run db:test

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint:ci

      - name: Test
        env:
          SLACK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          REFUND_HOLD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          FULFILLMENT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          PENDING_ACTIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          BACKORDER_RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          WEBHOOK_INBOX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          OOS_RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          PROVIDER_CAPACITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
          OPENAI_ADS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battle_platform_migrations?sslmode=disable
        id: test
        continue-on-error: true
        run: npm test -- --reporter=dot

      - name: Test deployment rollback and traffic safety
        run: node --test scripts/deploy/*.test.mjs

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce quality gates
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          MIGRATIONS_RESULT: ${{ steps.migrations.outcome }}
        run: |
          failed=0
          for gate in LINT TEST AUDIT BUILD MIGRATIONS; do
            result_variable="${gate}_RESULT"
            result="${!result_variable}"
            echo "${gate}: ${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"

  deploy:
    name: Build image and deploy
    needs: [verify, release-policy]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GCP_DEPLOY == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gcp-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Record exact build provenance
        env:
          SELECTIVE_RELEASE_ENABLED: ${{ vars.ENABLE_SELECTIVE_RELEASE }}
        run: python3 scripts/release/metadata.py > "$RUNNER_TEMP/release-metadata.json"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Verify required runtime configuration
        env:
          DATABASE_MIGRATIONS_ENABLED: ${{ vars.ENABLE_DATABASE_MIGRATIONS }}
          DATABASE_URL_SECRET_VERSION: ${{ vars.DATABASE_URL_SECRET_VERSION }}
        run: |
          service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format=json)"

          env_names="$(jq -r '.spec.template.spec.containers[0].env[]?.name' <<<"${service_json}")"
          for required_name in INNGEST_SIGNING_KEY INNGEST_EVENT_KEY BATTLE_BUS_API_KEY SHOPIFY_TEST_WEBHOOK_SECRET; do
            if ! jq --exit-status --arg name "${required_name}" '
              any(.spec.template.spec.containers[0].env[]?;
                .name == $name and .valueFrom.secretKeyRef? != null)
            ' <<<"${service_json}" >/dev/null; then
              echo "Cloud Run is missing required Secret Manager configuration: ${required_name}"
              exit 1
            fi
          done

          while IFS= read -r secret_name; do
            [[ -z "${secret_name}" || "${secret_name}" == \#* ]] && continue
            if jq --exit-status --arg name "${secret_name}" '
              any(.spec.template.spec.containers[0].env[]?;
                .name == $name and (. | has("value")))
            ' <<<"${service_json}" >/dev/null; then
              echo "Cloud Run secret must not be stored as plaintext: ${secret_name}"
              exit 1
            fi
          done < config/gcp-secret-env-names.txt

          if [ "${DATABASE_MIGRATIONS_ENABLED}" = "true" ]; then
            if [[ ! "${DATABASE_URL_SECRET_VERSION}" =~ ^[0-9]+$ ]]; then
              echo "DATABASE_URL_SECRET_VERSION must be a pinned numeric Secret Manager version."
              exit 1
            fi
            # The isolated job validates the pinned secret and database by
            # connecting as its existing migrator identity. Its required
            # successful execution gates promotion; the deployer does not need
            # Secret Manager or Cloud SQL metadata-enumeration permissions.
          fi

          service_url="$(jq -r '.status.url // empty' <<<"${service_json}")"
          if [ -z "${service_url}" ]; then
            echo "Cloud Run did not report a service URL."
            exit 1
          fi
          echo "CLOUD_RUN_URL=${service_url}" >> "${GITHUB_ENV}"

          if ! gcloud iam service-accounts describe "${RUNTIME_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Missing runtime service account: ${RUNTIME_SERVICE_ACCOUNT}"
            exit 1
          fi

      - name: Build container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --tag "${IMAGE_URI}" .

      - name: Smoke test container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8080:8080 "${IMAGE_URI}")"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          curl --fail --show-error --silent \
            --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/api/health | jq --exit-status '.ok == true and .service == "battle-bus"'

      - name: Push container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          docker push "${IMAGE_URI}"
          digest="$(gcloud artifacts docker images describe "$IMAGE_URI" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "RELEASE_IMAGE_URI=${IMAGE_URI%:*}@${digest}" >> "$GITHUB_ENV"

      - name: Build isolated migration image
        env:
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: docker build --file Dockerfile.migrations --tag "${MIGRATION_IMAGE_URI}" .

      - name: Verify isolated migration image contents
        env:
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: |
          docker run --rm --entrypoint /bin/sh "${MIGRATION_IMAGE_URI}" -c '
            test -x /usr/local/bin/cloud-run-migrate
            test "$(find /migrations -type f -name "*.up.sql" | wc -l)" -gt 0
            test "$(find /migrations -type f -name "*.down.sql" | wc -l)" -gt 0
          '

      - name: Push isolated migration image
        env:
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: docker push "${MIGRATION_IMAGE_URI}"

      - name: Update isolated migration job
        if: vars.ENABLE_DATABASE_MIGRATIONS == 'true'
        env:
          DATABASE_URL_SECRET_VERSION: ${{ vars.DATABASE_URL_SECRET_VERSION }}
          MIGRATION_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}-migrations:${{ github.sha }}
        run: |
          if ! gcloud run jobs describe "${MIGRATION_JOB}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            {
              echo "### Migration job bootstrap required"
              echo
              echo "The immutable migration image was pushed, but ${MIGRATION_JOB} does not exist."
              echo "Run scripts/bootstrap-migration-job.sh as a GCP administrator, then rerun this workflow."
              echo
              echo "Image: \`${MIGRATION_IMAGE_URI}\`"
              echo "Release: \`${GITHUB_SHA}\`"
              echo "Secret version: \`${DATABASE_URL_SECRET_VERSION}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          gcloud run jobs deploy "${MIGRATION_JOB}" \
            --image="${MIGRATION_IMAGE_URI}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --service-account="${MIGRATION_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
            --set-secrets="DATABASE_URL=${DATABASE_URL_SECRET}:${DATABASE_URL_SECRET_VERSION}" \
            --set-env-vars="MIGRATION_RELEASE_SHA=${GITHUB_SHA},DATABASE_URL_SECRET_VERSION=${DATABASE_URL_SECRET_VERSION},CLOUD_SQL_INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE}" \
            --command=/bin/sh \
            --args=/usr/local/bin/cloud-run-migrate \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=900s \
            --cpu=1 \
            --memory=512Mi \
            --quiet

      - name: Apply additive migrations in Cloud Run Job
        if: vars.ENABLE_DATABASE_MIGRATIONS == 'true'
        run: |
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --wait
          echo "Migration job ${MIGRATION_JOB} completed for ${GITHUB_SHA}." | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Deploy signed-webhook dry-run candidate without traffic
        env:
          SLACK_PUBLISH_ENABLED: ${{ vars.SLACK_PUBLISH_ENABLED || 'false' }}
          PENDING_ACTIONS_DURABLE_QUEUE_ENABLED: ${{ vars.PENDING_ACTIONS_DURABLE_QUEUE_ENABLED || 'false' }}
          WEBHOOK_INBOX_DURABLE_DELIVERY_ENABLED: ${{ vars.WEBHOOK_INBOX_DURABLE_DELIVERY_ENABLED || 'false' }}
          OOS_TARGETED_DRAIN_ENABLED: ${{ vars.OOS_TARGETED_DRAIN_ENABLED || 'false' }}
          PROVIDER_CAPACITY_ENABLED: ${{ vars.PROVIDER_CAPACITY_ENABLED || 'false' }}
          IMAGE_URI: ${{ env.RELEASE_IMAGE_URI }}
        run: |
          release_env="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("|".join(k+"="+v for k,v in d.items()))' "$RUNNER_TEMP/release-metadata.json")"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          revision_suffix="${GITHUB_SHA::8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" \
            --format=json > "$RUNNER_TEMP/bus-current.json"
          previous_traffic="$(node scripts/deploy/traffic-allocation.mjs "$RUNNER_TEMP/bus-current.json")"
          if [ "${WEBHOOK_INBOX_DURABLE_DELIVERY_ENABLED}" = "true" ]; then
            serving_revision="$(node scripts/deploy/webhook-inbox-activation.mjs serving "$RUNNER_TEMP/bus-current.json")"
            gcloud run revisions describe "${serving_revision}" \
              --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" \
              --format=json > "$RUNNER_TEMP/bus-serving-revision.json"
            node scripts/deploy/webhook-inbox-activation.mjs verify \
              "$RUNNER_TEMP/bus-current.json" "$RUNNER_TEMP/bus-serving-revision.json"
          fi
          echo "PREVIOUS_TRAFFIC=${previous_traffic}" >> "${GITHUB_ENV}"
          echo "CANDIDATE_TAG=${candidate_tag}" >> "${GITHUB_ENV}"
          echo "CANDIDATE_REVISION=${CLOUD_RUN_SERVICE}-${revision_suffix}" >> "${GITHUB_ENV}"
          operations_secret_binding="$(awk -F= '$1 == "BATTLE_BUS_OPERATIONS_API_KEY" { print $0 }' config/gcp-secret-bindings.txt)"
          if [[ ! "${operations_secret_binding}" =~ ^BATTLE_BUS_OPERATIONS_API_KEY=[a-z0-9-]+:[1-9][0-9]*$ ]]; then
            echo "Missing pinned BATTLE_BUS_OPERATIONS_API_KEY secret binding" >&2
            exit 1
          fi
          channel_lift_secret_bindings=""
          if [ "${CHANNEL_LIFT_SEND_ENABLED}" = "true" ] && [ "${CHANNEL_LIFT_ENABLED}" != "true" ]; then
            echo "CHANNEL_LIFT_SEND_ENABLED requires CHANNEL_LIFT_ENABLED=true" >&2
            exit 1
          fi
          if [ "${CHANNEL_LIFT_ENABLED}" = "true" ]; then
            if [ -z "${CHANNEL_LIFT_TRIPLE_WHALE_SHOP_ID}" ] \
              || [ -z "${CHANNEL_LIFT_META_DATASET_ID}" ] \
              || [ -z "${CHANNEL_LIFT_SOURCE_URL}" ]; then
              echo "Channel-lift non-secret configuration is incomplete" >&2
              exit 1
            fi
            if [[ ! "${CHANNEL_LIFT_META_DATASET_ID}" =~ ^[0-9]+$ ]]; then
              echo "CHANNEL_LIFT_META_DATASET_ID must be numeric" >&2
              exit 1
            fi
            channel_lift_bindings=()
            for env_name in TRIPLE_WHALE_API_KEY META_CONVERSIONS_ACCESS_TOKEN; do
              binding="$(awk -F= -v name="${env_name}" '$1 == name { print $0 }' config/gcp-secret-bindings.txt)"
              if [[ ! "${binding}" =~ ^${env_name}=[a-z0-9-]+:[1-9][0-9]*$ ]]; then
                echo "Missing pinned ${env_name} Secret Manager binding" >&2
                exit 1
              fi
              secret_ref="${binding#*=}"
              secret_id="${secret_ref%:*}"
              secret_version="${secret_ref##*:}"
              secret_state="$(gcloud secrets versions describe "${secret_version}" \
                --secret="${secret_id}" --project="${GCP_PROJECT_ID}" --format='value(state)')"
              if [ "${secret_state}" != "ENABLED" ]; then
                echo "Pinned ${env_name} secret version is not enabled" >&2
                exit 1
              fi
              gcloud secrets get-iam-policy "${secret_id}" \
                --project="${GCP_PROJECT_ID}" --format=json \
                | jq --exit-status --arg member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
                  'any(.bindings[]?; .role == "roles/secretmanager.secretAccessor" and any(.members[]?; . == $member))' \
                  >/dev/null
              channel_lift_bindings+=("${binding}")
            done
            channel_lift_secret_bindings=",$(IFS=,; echo "${channel_lift_bindings[*]}")"
          fi
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image="${IMAGE_URI}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --concurrency=20 \
            --min-instances=0 \
            --min=1 \
            --cpu-boost \
            --max-instances=10 \
            --ingress=all \
            --allow-unauthenticated \
            --no-traffic \
            --revision-suffix="${revision_suffix}" \
            --tag="${candidate_tag}" \
            "--update-secrets=CS_PLATFORM_WEBHOOK_SECRET=battle-hub-battle-bus-webhook-secret:1,EVENT_SEND_SECRET=battle-bus-api-key:1,BATTLE_BUS_API_KEY=battle-bus-api-key:1,${operations_secret_binding}${channel_lift_secret_bindings},SHOPIFY_TEST_ACCESS_TOKEN=battle-hub-shopify-test-access-token:1,SHOPIFY_TEST_SHOP_DOMAIN=battle-hub-shopify-test-shop-domain:1,D365_BASE_URL=battle-hub-d365-base-url:1,D365_CLIENT_ID=battle-hub-d365-client-id:1,D365_CLIENT_SECRET=battle-hub-d365-client-secret:1,D365_TENANT_ID=battle-hub-d365-tenant-id:1,D365_DATA_AREA_ID=battle-hub-d365-data-area-id:1,GPS_BASE_URL=battle-bus-gps-dev-base-url:1,GPS_API_KEY=battle-bus-gps-dev-api-key:1,GPS_API_SECRET=battle-bus-gps-dev-api-secret:1,GPS_WAREHOUSE_CODE=battle-bus-gps-dev-warehouse-code:1,GPS_UK_BASE_URL=battle-bus-gps-dev-uk-base-url:1,GPS_UK_API_KEY=battle-bus-gps-dev-uk-api-key:1,GPS_UK_API_SECRET=battle-bus-gps-dev-uk-api-secret:1,GPS_UK_WAREHOUSE_CODE=battle-bus-gps-dev-uk-warehouse-code:1" \
